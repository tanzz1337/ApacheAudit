# Apache HTTP Server Configuration (Demo - Intentionally Misconfigured)
# This file simulates a typical poorly-hardened Apache installation

ServerRoot "/etc/apache2"
ServerName demo.example.com

# Information Disclosure Issues
ServerTokens Full
ServerSignature Off
FileETag INode MTime Size

# Network Settings (too permissive)
Timeout 300
KeepAlive On
KeepAliveTimeout 60
MaxKeepAliveRequests 100

# Request limits not set (LimitRequestBody not configured)

# HTTP TRACE enabled (vulnerable)
TraceEnable On

# Root directory - no explicit deny
<Directory />
    Options FollowSymLinks
    AllowOverride All
</Directory>

# Document root with Indexes enabled
<Directory "/var/www/html">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# SSL Configuration (old protocols not disabled)
SSLProtocol all
SSLCipherSuite HIGH:MEDIUM:!aNULL:RC4:+MD5

# No security headers configured
# (Missing: X-Frame-Options, X-Content-Type-Options, etc.)

# Modules
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule ssl_module modules/mod_ssl.so
